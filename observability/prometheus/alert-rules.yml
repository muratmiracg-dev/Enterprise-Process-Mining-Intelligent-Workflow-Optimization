groups:
  - name: process-intelligence
    rules:
      - alert: ProcessAnalysisFailure
        expr: increase(process_optimizer_analysis_runs_total{status="failure"}[15m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Process analysis pipeline failed
          runbook: docs/runbooks/pipeline-failure.md
      - alert: ProcessDataUnavailable
        expr: process_optimizer_events_loaded < 100000
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Event volume dropped below the governed threshold
          runbook: docs/runbooks/data-quality-drift.md
      - alert: SLAAdherenceBelowTarget
        expr: process_optimizer_sla_adherence_ratio < 0.70
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Purchase-to-Pay SLA adherence is below 70%
          runbook: docs/runbooks/sla-risk-spike.md
