name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 4 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3.37.1
        if: always()
        with:
          sarif_file: trivy-results.sarif
