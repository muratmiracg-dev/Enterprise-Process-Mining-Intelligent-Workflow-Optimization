name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check src tests scripts
      - run: ruff check src tests scripts
      - name: Tests with branch coverage
        run: pytest --cov=process_optimizer --cov-report=term-missing --cov-report=xml
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      - name: Repository acceptance
        if: matrix.python-version == '3.12'
        run: python scripts/verify_repository.py --skip-office-render
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib

  deterministic-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/generate_demo_data.py --output "${{ runner.temp }}/regenerated"
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      - name: Verify regenerated data matches the committed benchmark
        run: python scripts/compare_demo_data.py "${{ runner.temp }}/regenerated"

  reproducible-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Snapshot committed reports
        run: cp -r reports "${{ runner.temp }}/committed-reports"
      - name: Rerun the analytical pipeline
        run: python scripts/run_demo.py
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      - name: Verify regenerated analysis matches the committed reports
        run: python scripts/compare_reports.py "${{ runner.temp }}/committed-reports" reports
