[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-process-optimizer"
version = "1.0.0"
description = "Explainable purchase-to-pay process mining, SLA prediction, and capacity optimization platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Murat Miraç Gedik" }]
keywords = [
  "process-mining",
  "business-analysis",
  "workflow-optimization",
  "pm4py",
  "fastapi",
  "power-bi",
]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pm4py>=2.7.22,<3",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pypdf>=5,<7",
  "pyyaml>=6,<7",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "reportlab>=4.2,<6",
  "ruff>=0.11,<1",
]

[project.scripts]
process-optimizer = "process_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: exercises optional integration boundaries",
]

[tool.coverage.run]
branch = true
source = ["process_optimizer"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
  "if __name__ == .__main__.:",
  "pragma: no cover",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
